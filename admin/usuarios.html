<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios - Admin Veterinaria San Marcos</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Estilos para la ventana emergente (modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background-color: #fff;
      padding: 2rem;
      border-radius: var(--radius-md, 12px);
      width: 100%;
      max-width: 500px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">San Marcos Admin</a>
      <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="usuarios.html" class="active">Usuarios</a></li>
        <li><a href="../login.html">Cerrar Sesión</a></li>
      </ul>
    </nav>
  </header>

  <main class="admin-container">
    <h1>Gestión de Usuarios</h1>
    
    <div class="action-bar" style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap;">
      <button class="btn" id="btn-nuevo-usuario">+ Nuevo Usuario</button>
      <input type="text" id="buscar-usuario" placeholder="Buscar por RUN o nombre..." style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); flex: 1; max-width: 300px;">
    </div>

    <div class="table-responsive">
      <table id="usuarios-table">
        <thead>
          <tr>
            <th>RUN</th>
            <th>Nombre Completo</th>
            <th>Correo Electrónico</th>
            <th>Teléfono</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="usuarios-list">
          <!-- Los usuarios guardados en LocalStorage se cargarán aquí automáticamente -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- MODAL DE NUEVO USUARIO -->
  <div id="modal-usuario" class="modal">
    <div class="modal-content">
      <span class="modal-close" id="modal-cerrar">&times;</span>
      <h2>Añadir Nuevo Usuario</h2>
      <form id="form-admin-usuario" style="margin-top: 1rem;">
        <div class="form-group">
          <label for="admin-run">RUN:</label>
          <input type="text" id="admin-run" required placeholder="12.345.678-9">
        </div>
        <div class="form-group">
          <label for="admin-nombre">Nombre Completo:</label>
          <input type="text" id="admin-nombre" required placeholder="Nombre Apellido">
        </div>
        <div class="form-group">
          <label for="admin-email">Correo Electrónico:</label>
          <input type="email" id="admin-email" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="admin-telefono">Teléfono:</label>
          <input type="tel" id="admin-telefono" required placeholder="+56 9 1234 5678">
        </div>
        <div class="form-group">
          <label for="admin-password">Contraseña:</label>
          <input type="password" id="admin-password" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="admin-rol">Rol:</label>
          <select id="admin-rol" required>
            <option value="Cliente">Cliente</option>
            <option value="Recepcionista">Recepcionista</option>
            <option value="Administrador">Administrador</option>
          </select>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Guardar Usuario</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Veterinaria San Marcos - Panel de Administración</p>
  </footer>

  <script src="../js/validaciones.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
