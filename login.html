<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Veterinaria San Marcos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Veterinaria San Marcos</a>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html" class="active">Login</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <h1>Iniciar Sesión</h1>
      <p>Ingresa a tu cuenta para gestionar tus reservas o acceder al panel.</p>

      <form id="form-login">
        <div class="form-group">
          <label for="correo">Correo Electrónico:</label>
          <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn">Ingresar</button>

        <div class="form-footer" style="margin-top: 1.5rem; text-align: center;">
          <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Veterinaria San Marcos. Todos los derechos reservados.</p>
  </footer>

  <script src="js/validaciones.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
