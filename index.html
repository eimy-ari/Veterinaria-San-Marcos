<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veterinaria San Marcos — Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🐾 Veterinaria San Marcos</h1>
      <p class="subtitle">Sistema de Servicios y Reservas</p>
    </div>
    <div id="sessionBar" class="session-bar">
      <span id="sessionBadge" class="badge">No autenticado</span>
      <button id="btnLogout" class="btn btn-secondary hidden" type="button">Cerrar sesión</button>
    </div>
  </header>

  <main class="container">
    <!-- Autenticación -->
    <section id="authSection" class="card">
      <h2>Iniciar sesión</h2>
      <form id="loginForm" class="form-grid">
        <label>
          Correo electrónico
          <input type="email" id="loginEmail" value="luciano@sanmarcos.cl" required />
        </label>
        <label>
          Contraseña
          <input type="password" id="loginPassword" value="Password123!" required />
        </label>
        <button type="submit" class="btn btn-primary">Ingresar con JWT</button>
      </form>
      <p id="authMessage" class="msg"></p>
    </section>

    <!-- Catálogo de Servicios -->
    <section class="card">
      <div class="section-header">
        <h2>Servicios veterinarios</h2>
        <button id="btnReloadServicios" class="btn btn-outline" type="button">Actualizar</button>
      </div>
      <div id="serviciosList" class="grid-cards"></div>

      <!-- Restringido a ROLE_ADMIN -->
      <div id="adminServiceBox" class="admin-box hidden">
        <h3>➕ Nuevo servicio (Solo ADMIN)</h3>
        <form id="createServicioForm" class="form-grid">
          <label>
            Nombre
            <input type="text" id="srvNombre" placeholder="Vacunación" required />
          </label>
          <label>
            Descripción
            <input type="text" id="srvDescripcion" placeholder="Vacuna anual" required />
          </label>
          <label>
            Precio (CLP)
            <input type="number" id="srvPrecio" min="1" placeholder="18000" required />
          </label>
          <button type="submit" class="btn btn-primary">Crear servicio</button>
        </form>
        <p id="adminMessage" class="msg"></p>
      </div>
    </section>

    <!-- Reservas (requiere sesión JWT) -->
    <section id="reservasSection" class="card">
      <h2>Reservas de atención</h2>
      <p id="reservasLockedMsg" class="msg">Inicia sesión para crear y consultar reservas.</p>

      <div id="reservasContent" class="hidden">
        <form id="createReservaForm" class="form-grid">
          <label>
            Nombre mascota
            <input type="text" id="resMascota" placeholder="Toby" required />
          </label>
          <label>
            Especie
            <input type="text" id="resEspecie" placeholder="Perro" required />
          </label>
          <label>
            Fecha y hora
            <input type="datetime-local" id="resFechaHora" value="2026-11-26T10:30" required />
          </label>
          <label>
            Servicio
            <select id="resServicioId" required></select>
          </label>
          <button type="submit" class="btn btn-primary">Agendar reserva</button>
        </form>
        <p id="reservaMessage" class="msg"></p>

        <h3>Listado de reservas</h3>
        <div id="reservasList" class="grid-cards"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
